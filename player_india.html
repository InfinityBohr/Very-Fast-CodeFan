<!DOCTYPE html>
<html lang="en">
<head>
  <title>Fancode Premium Live Stream Player</title>
      <link data-rh="true" rel="icon" href="https://www.fancode.com/skillup-uploads/fc-web-logo/favicon.png"/>

  <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no"/>
  <meta name="referrer" content="no-referrer"/>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/plyr@3.6.12/dist/plyr.css"/>
  <style>
    body {
      background-color: #000000;
      margin: 0;
      padding: 0;
      overflow: hidden;
    }
    html, body {
      height: 100%;
    }
    video {
      width: 100%;
      height: 100%;
      max-width: 100%;
    }
    .plyr {
      height: 100%;
    }

    /* Loader Styles */
    #loader {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: #000;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 9999;
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }
    #loader.hidden {
      opacity: 0;
      visibility: hidden;
    }
    .spinner {
      width: 60px;
      height: 60px;
      border: 6px solid rgba(255,255,255,0.2);
      border-top: 6px solid #ff004c;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin-bottom: 15px;
    }
    @keyframes spin {
      0% { transform: rotate(0deg);}
      100% { transform: rotate(360deg);}
    }
    .loading-text {
      color: #fff;
      font-family: Arial, sans-serif;
      font-size: 16px;
      letter-spacing: 1px;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0% { opacity: 0.6; }
      50% { opacity: 1; }
      100% { opacity: 0.6; }
    }

    /* back button style */

    .back-btn {
    color: white;
    text-decoration: none;
    font-size: 24px;
    background: rgba(255,255,255,0.1);
    width: 40px;
    height: 40px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 50%;
    backdrop-filter: blur(10px);
    transition: all 0.3s;
}

.back-btn:hover { background: var(--primary); transform: scale(1.1); }


/* Header/Overlay */
.player-header {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    padding: 15px 25px;
    background: linear-gradient(to bottom, rgba(0,0,0,0.8) 0%, transparent 100%);
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: space-between;
    transition: opacity 0.3s ease;
}

.header-left { display: flex; align-items: center; gap: 15px; }
.header-right { display: flex; align-items: center; gap: 10px; }
  </style>
 <script src="https://cdn.jsdelivr.net/npm/hls.js@1.1.4/dist/hls.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/plyr@3.6.12/dist/plyr.min.js"></script> 
</head>
<body>
<div class="player-header" id="header">
  <!-- Loader -->
  <div id="loader">
    <div class="spinner"></div>
    <div class="loading-text">Loading Stream...</div>
  </div>

  
    <div class="header-left">
        <a href="http://www.fancode.ib" class="back-btn">←</a>
        <div class="channel-info">
            <img src="http://www.bohrtv.ib/LiveTV/assets/ottapplogo/FanCode.png" alt="Fancode" class="channel-logo" onerror="this.style.display='none'">
            <span class="channel-name"><span style="background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%); color: #000; padding: 2px 6px; border-radius: 4px; font-size: 10px; font-weight: 800; margin-left: 8px; vertical-align: middle;">Fancode</span></span>
        </div>
    </div>
    <div class="header-right">
        <span style="font-family:'Bebas Neue',sans-serif;font-size:20px;color:white;letter-spacing:1px;">SPORT'S <span style="color:#ff3e3e;"> LIVE TV</span></span>
    </div>
</div>

  <!-- Player  default-->
    <video id="player" autoplay muted playsinline controls crossorigin poster="https://i.ibb.co/mFX4Df9C/Homepage-DWeb-Main-Banner.png"></video>
  

  
  <script>
  document.addEventListener('DOMContentLoaded', () => {
    const video = document.getElementById('player');
    const loader = document.getElementById('loader');
    const streamUrl = new URLSearchParams(window.location.search).get("stream");

    if (!streamUrl) {
      document.body.innerHTML = "<p>No stream URL provided (?stream=)</p>";
      return;
    }

    function hideLoader() {
      loader.classList.add('hidden');
    }

    if (Hls.isSupported()) {
      const hls = new Hls({ maxMaxBufferLength: 100 });
      hls.loadSource(streamUrl);
      hls.attachMedia(video);
      hls.on(Hls.Events.MANIFEST_PARSED, () => {
        const availableQualities = hls.levels.map(level => level.height).filter(Boolean).sort((a, b) => b - a);
        const defaultQuality = availableQualities.includes(1080) ? 1080 : (availableQualities[0] || 360);
        const player = new Plyr(video, {
          autoplay: true,
          muted: true,
          controls: ['play-large', 'play', 'mute', 'volume', 'settings', 'fullscreen'],
          quality: {
            default: defaultQuality,
            options: availableQualities,
            forced: true,
            onChange: (quality) => {
              hls.levels.forEach((level, levelIndex) => {
                if (level.height === quality) {
                  hls.currentLevel = levelIndex;
                }
              });
            }
          }
        });

        // Try auto play
        video.play().catch(err => console.warn("Autoplay blocked:", err));

        // Hide loader when video starts playing
        video.addEventListener('playing', hideLoader);

        // Orientation lock
        document.addEventListener('fullscreenchange', () => {
          if (document.fullscreenElement) {
            if (screen.orientation && screen.orientation.lock) {
              screen.orientation.lock('landscape').catch(err => {
                console.error('Error locking orientation:', err);
              });
            }
          }
        });
      });
    } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
      video.src = streamUrl;
      const player = new Plyr(video, { autoplay: true, muted: true });
      video.play().catch(err => console.warn("Autoplay blocked:", err));
      video.addEventListener('playing', hideLoader);
    } else {
      document.body.innerHTML = '<p>Your browser does not support HLS playback.</p>';
    }
  });
  </script>
</body>
</html>
